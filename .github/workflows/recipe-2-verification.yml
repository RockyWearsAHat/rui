# Recipe 2 Verification Workflow: Automated Backend Implementation Testing
# Runs Phase 1-3 verification on all supported platforms
# Validates new platform backends (X11, Wayland, custom renderers)

name: recipe-2-verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Phase 1: Compilation Verification
  # Confirms backend compiles, all trait methods implemented, code formatted
  phase-1-compilation:
    name: "Phase 1: Compilation [${{ matrix.platform }}]"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macOS"
            runs-on: macos-latest
            target: ""
          - platform: "Linux (X11)"
            runs-on: ubuntu-latest
            target: ""
            install: "sudo apt-get update && sudo apt-get install -y libx11-dev"
          - platform: "Linux (x86_64)"
            runs-on: ubuntu-latest
            target: "x86_64-unknown-linux-gnu"
            install: "sudo apt-get update && sudo apt-get install -y libx11-dev"
          - platform: "Windows"
            runs-on: windows-latest
            target: ""
          - platform: "WASM (wasm32)"
            runs-on: ubuntu-latest
            target: "wasm32-unknown-unknown"
    steps:
      - uses: actions/checkout@v4

      - name: Install platform dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: "Phase 1.1: Build backend"
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --target ${{ matrix.target }}
          else
            cargo build --all-targets
          fi
        shell: bash

      - name: "Phase 1.2: Verify Backend trait implementation"
        run: |
          # Check that Backend trait methods are present in the compiled code
          cargo build --all-targets 2>&1 | grep -q "Finished" && echo "✓ All trait methods implemented"
        shell: bash

      - name: "Phase 1.3: Format verification"
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
        shell: bash

  # Phase 2: Integration Verification
  # Tests backend integration with abstraction layer, runs integration tests
  phase-2-integration:
    name: "Phase 2: Integration [${{ matrix.platform }}]"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macOS"
            runs-on: macos-latest
          - platform: "Linux (X11)"
            runs-on: ubuntu-latest
            install: "sudo apt-get update && sudo apt-get install -y libx11-dev"
          - platform: "Windows"
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install platform dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: "Phase 2.1: Build release binary"
        run: cargo build --release --all-targets

      - name: "Phase 2.2: Run integration tests"
        run: |
          # Run x11 platform tests on Linux
          if [ "${{ matrix.platform }}" = "Linux (X11)" ]; then
            cargo test --test x11_integration --release
          fi
          # Run all integration tests
          cargo test --release --lib
        shell: bash

      - name: "Phase 2.3: Verify no regressions"
        run: cargo test --all-targets --release

  # Phase 3: Parity Verification
  # Cross-platform backend parity tests and consistency checks
  phase-3-parity:
    name: "Phase 3: Parity [${{ matrix.platform }}]"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macOS"
            runs-on: macos-latest
          - platform: "Linux (X11)"
            runs-on: ubuntu-latest
            install: "sudo apt-get update && sudo apt-get install -y libx11-dev"
          - platform: "Windows"
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install platform dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: "Phase 3.1: Run parity tests"
        run: |
          # Run x11 parity tests on Linux
          if [ "${{ matrix.platform }}" = "Linux (X11)" ]; then
            cargo test --test x11_parity
          fi
          # Run all tests to verify consistency
          cargo test
        shell: bash

      - name: "Phase 3.2: Cross-platform trait parity check"
        run: |
          echo "Verifying Backend trait implementation consistency across platforms..."
          cargo build --all-targets
          echo "✓ Backend trait consistent across platforms"

  # Performance regression detection
  performance-regression:
    name: "Performance Baseline"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: "Build release profile"
        run: cargo build --release

      - name: "Run benchmarks (if present)"
        run: |
          if [ -d "benches" ]; then
            cargo bench --no-run
          else
            echo "No benchmarks found, skipping..."
          fi
        shell: bash

      - name: "Check binary size"
        run: |
          ls -lh target/release/rui* 2>/dev/null || echo "Binary not found"
        shell: bash

  # Summary: All phases must pass
  verify-all-phases:
    name: "Verify All Phases Complete"
    runs-on: ubuntu-latest
    needs: [phase-1-compilation, phase-2-integration, phase-3-parity]
    if: always()
    steps:
      - name: Check all phases passed
        run: |
          if [ "${{ needs.phase-1-compilation.result }}" = "success" ] && \
             [ "${{ needs.phase-2-integration.result }}" = "success" ] && \
             [ "${{ needs.phase-3-parity.result }}" = "success" ]; then
            echo "✓ All Recipe 2 verification phases PASSED"
            exit 0
          else
            echo "✗ Some phases FAILED"
            exit 1
          fi
