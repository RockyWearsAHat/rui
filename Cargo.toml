[package]
name = "rui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/RockyWearsAHat/rui"
readme = "README.md"
description = "A declarative interface library for Rust: structure, style, and behaviour in one language, drawn by its own renderer, with no dependencies."
keywords = ["gui", "ui", "declarative", "renderer", "no-std-deps"]
categories = ["gui", "rendering"]
exclude = ["/.github"]

[lib]
crate-type = ["cdylib", "rlib"]

# Nothing. Not a policy so much as a consequence: the TrueType parser, the glyph
# rasteriser, the text layout, the PNG writer, and the platform windows are all
# in this crate, so there is nothing left to depend on.
[dependencies]

# Except in a browser, where the platform is not callable from Rust at all: its
# windows and its canvases are JavaScript objects, and `wasm-bindgen` *is* the
# call into them. Scoped to `wasm32` rather than added outright, so a build for
# any of the three native platforms still resolves to no dependencies.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "ImageData",
    "MediaQueryList",
    "MouseEvent",
    "Window",
] }

# The rendering suite builds the `<canvas>` the backend looks for, and reads the
# pixels back out of it afterwards, inside a browser `wasm-bindgen-test` drives.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["HtmlElement", "Node"] }

[lints.rust]
# Not `forbid`: opening a window is the one thing that cannot be done without
# calling the platform. Every `unsafe` in the crate is inside `src/shell/platform/`,
# and nothing above it — the elements, the layout, the renderer, the fonts —
# contains any.
unsafe_code = "deny"
missing_docs = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
