[package]
name = "rui-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/RockyWearsAHat/rui"
readme = "README.md"
description = "A declarative interface library for Rust with native platform backends (macOS, Windows, X11, WASM): structure, style, and behaviour in one language, drawn by its own renderer, with no dependencies."
keywords = ["gui", "ui", "declarative", "renderer", "no-std-deps"]
categories = ["gui", "rendering"]
exclude = ["/.github"]

[lib]
name = "rui"
crate-type = ["rlib"]

[dependencies]

[features]
default = ["macos", "windows", "x11", "wayland-backend"]
# Native platform backends
macos = []
windows = []
x11 = []
wayland-backend = []
wasm = []
# Draws the wasm backend's frames with WebGPU when the browser has it,
# falling back to the 2D canvas when it does not. See src/gpu.rs.
webgpu = ["wasm"]
reload = []
# Linux tray feature: requires D-Bus and system integration
linux-tray = []
# Wayland display server (legacy feature name for backward compat)
wayland = ["wayland-backend"]

# Except in a browser, where the platform is not callable from Rust at all: its
# windows and its canvases are JavaScript objects, and `wasm-bindgen` *is* the
# call into them. Scoped to `wasm32` rather than added outright, so a build for
# any of the three native platforms still resolves to no dependencies.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Performance",
    "Window",
    "WheelEvent",
] }
web-time = "1"

# The rendering suite builds the `<canvas>` the backend looks for, and reads the
# pixels back out of it afterwards, inside a browser `wasm-bindgen-test` drives.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["HtmlElement", "Node"] }

[lints.rust]
# Not `forbid`: opening a window is the one thing that cannot be done without
# calling the platform. Every `unsafe` in the crate is inside `src/shell/platform/`,
# and nothing above it — the elements, the layout, the renderer, the fonts —
# contains any.
unsafe_code = "deny"
missing_docs = "warn"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
