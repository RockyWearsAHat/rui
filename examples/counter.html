<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rui Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        canvas {
            border: 1px solid #ccc;
            background-color: white;
            display: block;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        button:active {
            background-color: #e0e0e0;
        }

        .info {
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>rui Counter Example</h1>
        <canvas id="surface" width="960" height="640"></canvas>
        <div class="controls">
            <button onclick="manualRedraw()">Redraw</button>
            <button onclick="resetCounter()">Reset App</button>
        </div>
        <div class="info" id="status">Loading wasm module...</div>
    </div>

    <script type="module">
        // Import the wasm module
        import init, * as rui from '/pkg/rui.js';

        let wasmReady = false;

        async function initWasm() {
            try {
                await init();
                wasmReady = true;

                // Initialize the counter app
                rui.init_counter();

                document.getElementById('status').textContent = 'Counter initialized. Click buttons in canvas.';

                // Start the frame loop
                startFrameLoop();
            } catch (error) {
                console.error('Failed to initialize wasm:', error);
                document.getElementById('status').textContent = 'Error: ' + error.message;
            }
        }

        function startFrameLoop() {
            function frameLoop() {
                if (!wasmReady) {
                    requestAnimationFrame(frameLoop);
                    return;
                }

                try {
                    // Collect events from the browser
                    rui.listen_counter();

                    // Render and present the frame
                    rui.present_counter();
                } catch (error) {
                    console.error('Frame loop error:', error);
                    document.getElementById('status').textContent = 'Error: ' + error.message;
                }

                requestAnimationFrame(frameLoop);
            }

            requestAnimationFrame(frameLoop);
        }

        window.manualRedraw = function() {
            if (!wasmReady) return;
            try {
                rui.listen_counter();
                rui.present_counter();
                console.log('Manual redraw completed');
            } catch (error) {
                console.error('Redraw error:', error);
            }
        };

        window.resetCounter = function() {
            if (!wasmReady) return;
            try {
                rui.init_counter();
                rui.listen_counter();
                rui.present_counter();
                console.log('Counter reset');
            } catch (error) {
                console.error('Reset error:', error);
            }
        };

        // Initialize wasm on page load
        initWasm();
    </script>
</body>
</html>
