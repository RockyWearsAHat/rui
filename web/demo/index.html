<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUI Showcase</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: system-ui, -apple-system, sans-serif;
            color: #333;
        }

        #rui-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: -1;
        }

        .loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="rui-canvas"></canvas>
    <div class="loading" id="loading">
        <div>Loading RUI showcase…</div>
    </div>

    <script type="module">
        import init from './rui_demo.js';

        const CHUNKS = ['aa', 'ab', 'ac', 'ad'];

        async function loadWasmBytes() {
            const parts = await Promise.all(
                CHUNKS.map(async (suffix) => {
                    const res = await fetch(`./rui_demo_bg.wasm.chunk.${suffix}`);
                    if (!res.ok) throw new Error(`chunk ${suffix} failed: ${res.status}`);
                    return new Uint8Array(await res.arrayBuffer());
                })
            );
            const total = parts.reduce((n, p) => n + p.length, 0);
            const bytes = new Uint8Array(total);
            let offset = 0;
            for (const p of parts) {
                bytes.set(p, offset);
                offset += p.length;
            }
            return bytes;
        }

        (async () => {
            try {
                console.log('RUI Showcase: Initializing...');
                const wasmBytes = await loadWasmBytes();
                await init({ module_or_path: wasmBytes });
                document.getElementById('loading')?.classList.add('hidden');
                console.log('RUI Showcase: Ready');
            } catch (err) {
                console.error('RUI Showcase failed:', err);
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.textContent = 'Error: ' + err.message;
                }
            }
        })();
    </script>
</body>
</html>
