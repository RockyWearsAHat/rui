[package]
name = "rui-demo"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.wasm-pack]
wasm-opt = ["-Os", "--enable-bulk-memory"]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
rui = { package = "rui-native", path = "../../" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }
web-time = "1"
